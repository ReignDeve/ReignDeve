<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 96" width="1280" height="96" role="img"><title>Projects</title><style>.grow{transform-box:fill-box;transform-origin:left;animation:growx 2s cubic-bezier(0.2, 0.7, 0.1, 1) both}@keyframes growx{from{transform:scaleX(0)}}
.fade{animation:fade 1.4s cubic-bezier(0.2, 0.7, 0.1, 1) both}
.rise{animation:rise 1.4s cubic-bezier(0.2, 0.7, 0.1, 1) both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(0.2, 0.7, 0.1, 1) forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s 1s ease-out infinite;opacity:0}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{opacity:.8;transform:scale(1)}70%,100%{opacity:0;transform:scale(3.4)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}.pulse{display:none}}
